<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ザクッと弾ける架空のチョコクランチアイスサンド、CRUNCHY POPの自主制作LPです。">
  <meta name="theme-color" content="#ffe83d">
  <title>CRUNCHY POP｜ザクッと、ひんやり。</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="header-logo" href="#top" aria-label="CRUNCHY POP ページ上部へ"><span class="header-logo-crunchy">CRUNCHY</span><span class="header-logo-pop">POP</span></a>
      <nav class="desktop-nav" aria-label="メインナビゲーション">
        <a href="#texture">食感</a>
        <a href="#process">こだわり</a>
        <a href="#lineup">フレーバー</a>
        <a class="header-cta" href="#trial">おためしセット</a>
      </nav>
      <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="mobile-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <nav class="mobile-nav" id="mobile-nav" aria-label="スマートフォン用メニュー" aria-hidden="true">
    <a href="#texture">食感</a>
    <a href="#process">こだわり</a>
    <a href="#lineup">フレーバー</a>
    <a class="header-cta" href="#trial">おためしセット</a>
  </nav>
  <main class="lp-shell" id="top">
    <h1 class="sr-only">CRUNCHY POP チョコクランチアイスサンド</h1>
    <picture class="lp-section"><source media="(max-width: 767px)" srcset="./images/mobile/01-hero.png"><img src="./images/01-hero.png" alt="ザクッと、ひんやり。気分まで弾ける。" fetchpriority="high"></picture>
    <picture class="lp-section" id="texture"><source media="(max-width: 767px)" srcset="./images/mobile/02-texture.png"><img src="./images/02-texture.png" alt="ひとくちでわかる、3つの食感。" loading="lazy"></picture>
    <picture class="lp-section" id="process"><source media="(max-width: 767px)" srcset="./images/mobile/03-process.png"><img src="./images/03-process.png" alt="おいしい音まで、ていねいにつくる。" loading="lazy"></picture>
    <picture class="lp-section" id="lineup"><source media="(max-width: 767px)" srcset="./images/mobile/04-lineup.png"><img src="./images/04-lineup.png" alt="選ぶたび、気分が弾ける。" loading="lazy"></picture>
    <picture class="lp-section"><source media="(max-width: 767px)" srcset="./images/mobile/05-limited.png"><img src="./images/05-limited.png" alt="この夏だけの、ソーダレモンがはじける。" loading="lazy"></picture>
    <picture class="lp-section"><source media="(max-width: 767px)" srcset="./images/mobile/06-arrange.png"><img src="./images/06-arrange.png" alt="ひと手間で、もっとおいしい。" loading="lazy"></picture>
    <section class="lp-section lp-cta-section" id="trial" aria-label="おためしセットのご案内">
      <picture><source media="(max-width: 767px)" srcset="./images/mobile/07-story-cta.png"><img src="./images/07-story-cta.png" alt="ザクザクの音から、楽しい時間をつくりたい。3種おためしセット1,980円（税込・送料無料）。" loading="lazy"></picture>
      <a class="trial-set-button" href="#lineup" aria-label="おためしセットを見る"></a>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
