<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AIムービーキャンパス｜未経験から90日でAI動画クリエイターを目指すオンライン講座</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="lp-shell" aria-label="AIムービーキャンパス LP">
      <div class="cta-hotspot-wrap">
        <picture class="lp-section lp-section-hero">
          <source media="(max-width: 767px)" srcset="./images/mobile/01-hero.png">
          <img class="lp-section-img img-ratio-hero" src="./images/01-hero.png" alt="AIムービーキャンパス｜未経験から90日でAI動画クリエイターを目指すオンライン講座" decoding="async" fetchpriority="high">
        </picture>
        <a href="#reserve" class="cta-hotspot cta-hotspot-hero-pc cta-trigger" aria-label="無料説明会に申し込む"></a>
        <a href="#reserve" class="cta-hotspot cta-hotspot-hero-mobile cta-trigger" aria-label="無料説明会に申し込む"></a>
        <button type="button" class="cta-hotspot cta-hotspot-line-pc cta-trigger" aria-label="LINEでAI動画制作のコツを配信中" data-toast="ただいまLINE登録ページを準備中です。今しばらくお待ちください。"></button>
        <button type="button" class="cta-hotspot cta-hotspot-line-mobile cta-trigger" aria-label="LINEでAI動画制作のコツを配信中" data-toast="ただいまLINE登録ページを準備中です。今しばらくお待ちください。"></button>
      </div>
      <picture class="lp-section reveal">
        <source media="(max-width: 767px)" srcset="./images/mobile/02-pain-points.png">
        <img class="lp-section-img img-ratio-pain-points" src="./images/02-pain-points.png" alt="" loading="lazy">
      </picture>
      <picture class="lp-section reveal">
        <source media="(max-width: 767px)" srcset="./images/mobile/03-reasons.png">
        <img class="lp-section-img img-ratio-reasons" src="./images/03-reasons.png" alt="" loading="lazy">
      </picture>
      <picture class="lp-section reveal">
        <source media="(max-width: 767px)" srcset="./images/mobile/04-curriculum.png">
        <img class="lp-section-img img-ratio-curriculum" src="./images/04-curriculum.png" alt="" loading="lazy">
      </picture>
      <picture class="lp-section reveal">
        <source media="(max-width: 767px)" srcset="./images/mobile/05-voices.png">
        <img class="lp-section-img img-ratio-voices" src="./images/05-voices.png" alt="" loading="lazy">
      </picture>

      <section class="stats-badge reveal" aria-label="実績">
        <div class="stats-badge-item">
          <p class="stats-badge-number"><span class="count-up" data-target="312">0</span>名</p>
          <p class="stats-badge-label">累計受講者数</p>
        </div>
        <div class="stats-badge-item">
          <p class="stats-badge-number"><span class="count-up" data-target="94">0</span>%</p>
          <p class="stats-badge-label">受講満足度</p>
        </div>
      </section>

      <picture class="lp-section reveal">
        <source media="(max-width: 767px)" srcset="./images/mobile/06-trial-lesson.png">
        <img class="lp-section-img img-ratio-trial-lesson" src="./images/06-trial-lesson.png" alt="" loading="lazy">
      </picture>
      <picture class="lp-section reveal">
        <source media="(max-width: 767px)" srcset="./images/mobile/07-price.png">
        <img class="lp-section-img img-ratio-price" src="./images/07-price.png" alt="" loading="lazy">
      </picture>
      <picture class="lp-section reveal">
        <source media="(max-width: 767px)" srcset="./images/mobile/08-faq.png">
        <img class="lp-section-img img-ratio-faq" src="./images/08-faq.png" alt="" loading="lazy">
      </picture>
      <div class="cta-hotspot-wrap reveal" id="reserve">
        <picture class="lp-section">
          <source media="(max-width: 767px)" srcset="./images/mobile/09-closing-cta.png">
          <img class="lp-section-img img-ratio-closing-cta" src="./images/09-closing-cta.png" alt="" loading="lazy">
        </picture>
        <a href="#reserve" class="cta-hotspot cta-hotspot-closing-pc cta-trigger" aria-label="無料説明会に申し込む"></a>
        <a href="#reserve" class="cta-hotspot cta-hotspot-closing-mobile cta-trigger" aria-label="無料説明会に申し込む"></a>
      </div>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>

    <button type="button" class="back-to-top" aria-label="トップへ戻る">↑</button>
    <script src="./script.js"></script>
  </body>
</html>
